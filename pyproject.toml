[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope-desktop"
version = "1.0.0"
description = "Local-first home network observability for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6==6.9.3", "psutil==7.1.0"]

[project.scripts]
netscope = "netscope.app:main"

[tool.setuptools.packages.find]
include = ["netscope*"]

[tool.setuptools.package-data]
netscope = ["i18n/locales/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
